<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap');

      .bg { fill: #fcf9f2; }
      .card { fill: #ffffff; stroke: #eadecc; stroke-width: 2px; rx: 24px; }
      
      .main-title {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        font-size: 64px;
        fill: #1a1a1a;
        letter-spacing: -2px;
      }
      
      .subtitle {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 600;
        font-size: 18px;
        fill: #6b2d35; /* Tu tono burgundy */
        letter-spacing: 3px;
        text-transform: uppercase;
      }
      
      .name {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 500;
        font-size: 22px;
        fill: #555555;
      }
      
      .dev {
        font-weight: 700;
        fill: #6b2d35;
      }

      /* Elementos gráficos decorativos */
      .deco-circle {
        fill: none;
        stroke: #6b2d35;
        stroke-width: 1.5px;
        opacity: 0.15;
      }
      
      .dot {
        fill: #6b2d35;
        opacity: 0.4;
      }
    </style>
  </defs>

  <!-- Fondo principal color crema -->
  <rect width="1200" height="630" class="bg"/>

  <!-- Círculos decorativos abstractos de fondo estilo editorial -->
  <circle cx="1000" cy="150" r="180" class="deco-circle"/>
  <circle cx="1000" cy="150" r="100" class="deco-circle"/>
  <circle cx="200" cy="500" r="220" class="deco-circle"/>
  
  <!-- Puntos decorativos -->
  <circle cx="850" cy="200" r="5" class="dot"/>
  <circle cx="350" cy="450" r="4" class="dot"/>
  <circle cx="950" cy="480" r="6" class="dot"/>

  <!-- Tarjeta central limpia que enmarca el texto -->
  <rect x="120" y="100" width="960" height="430" class="card" filter="drop-shadow(0px 20px 40px rgba(107, 45, 53, 0.06))"/>

  <!-- Línea decorativa superior dentro de la tarjeta -->
  <line x1="180" y1="180" x2="240" y2="180" stroke="#6b2d35" stroke-width="3" stroke-linecap="round"/>

  <!-- Bloque Superior: Categoría o ámbito -->
  <g transform="translate(180, 235)">
    <text x="0" y="0" class="subtitle">SOFTWARE DEVELOPMENT</text>
  </g>

  <!-- Bloque Central: Mi Portfolio Web en grande -->
  <g transform="translate(180, 335)">
    <text x="0" y="0" class="main-title">Mi Portfolio Web.</text>
  </g>

  <!-- Bloque Inferior: Tu Nombre -->
  <g transform="translate(180, 440)">
    <text x="0" y="0" class="name">Ainhoa García Sanz<tspan class="dev">.dev</tspan></text>
  </g>

  <!-- Pequeño detalle gráfico en la esquina inferior derecha de la tarjeta -->
  <rect x="960" y="440" width="60" height="3" fill="#6b2d35" opacity="0.3" rx="1.5"/>
</svg>
